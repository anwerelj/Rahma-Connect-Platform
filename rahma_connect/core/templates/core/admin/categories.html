{% extends "core/common/base.html" %}
{% block title %}Catégories{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Catégories de ressources</h1><p class="muted">Les catégories disponibles sur la plateforme.</p></div></div>
<div class="cat-grid">
  {% for c in categories %}
    <div class="card cat-card"><h3>{{ c.nom }}</h3><p class="muted">{{ c.description }}</p></div>
  {% endfor %}
</div>
{% endblock %}
