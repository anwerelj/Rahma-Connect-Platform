{% extends "core/common/base.html" %}
{% block title %}Nouveau besoin{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Nouveau besoin</h1></div></div>
<form class="card form-card" method="post" novalidate>
  {% csrf_token %}
  <div class="grid-2">{% for field in form %}{% include "core/partials/field.html" %}{% endfor %}</div>
  <div class="form-actions"><a class="btn btn-ghost" href="{% url 'asso_besoins' %}">Annuler</a><button class="btn btn-primary" type="submit">Enregistrer</button></div>
</form>
{% endblock %}
